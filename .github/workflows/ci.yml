name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # 不開 npm 快取：本機全域 gitignore 排除 package-lock.json，
          # repo 無 lockfile 時 cache: npm 會在 setup-node 直接失敗

      - run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          TURSO_DATABASE_URL: file:./local.db
          TURSO_AUTH_TOKEN: ''
          # 僅供 build 期 env 驗證（zod min(8)）通過，非真實密鑰
          APP_SECRET: ci-dummy-secret
        run: |
          npm run db:migrate
          npm run build
